# Allowlist of Android Lint issue IDs that may be disabled module-wide (`disable += "..."`
# inside a `lint { }` block), each with the reason it's there. Read by
# scripts/check-lint-guardrails.sh, which fails a build/commit that disables an issue ID not
# listed here — see docs/coding-guardrails.md#static-analysis--android-lint for the policy this
# enforces: fix real findings, don't baseline or blanket-disable them without a stated reason.
#
# Format: one entry per line, "IssueId: reason". Comment lines start with '#'.

GradleDependency: advisory that a newer dependency version is available, not a defect.
AndroidGradlePluginVersion: advisory that a newer Gradle/AGP is available; bumping is a deliberate, separately-verified decision, not something to nag about on every lint run.
RestrictedApi: 100% Room's own generated Dao_Impl classes calling Room-internal @RestrictTo APIs, flagged only because this project's Maven group isn't "androidx".
