# Case-insensitive extended-regex patterns (one per line) that must never appear in a commit
# message, a PR/push description, or a tracked file's content — AI-authorship attribution,
# regardless of which tool. Read by scripts/check-no-ai-attribution.sh.
#
# This is about attribution/authorship disclosure, not the tool name in general — CLAUDE.md and
# .claude/skills/*/SKILL.md legitimately name "Claude Code" as the tool they configure, and are
# NOT attribution claims, so they are exempted (see EXEMPT_PATHS in the checker script) rather
# than making this list impossible to satisfy for the very automation that enforces it.
#
# Comment lines start with '#'. Keep each pattern tight enough to not false-positive on ordinary
# engineering prose (e.g. a commit legitimately mentioning "co-authored" a design doc with a
# human).

co-authored-by:.*(claude|anthropic|gpt|openai|copilot|gemini|chatgpt)
generated (with|by) (claude|chatgpt|copilot|gpt|gemini|an? ai|anthropic)
🤖 generated
written (by|with) (claude|chatgpt|copilot|gpt-[0-9]|an? ai)
ai[- ]generated
this (commit|pr|change|code) was (written|generated|authored) by (an? )?(ai|claude|chatgpt|copilot|gpt)
\bclaude[- ]?code\b.*(wrote|authored|generated|created) this
