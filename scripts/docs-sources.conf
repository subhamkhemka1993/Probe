# Maps each split guide file to the source paths it documents.
#
# Format: blocks separated by a blank line. Each block's first line is
# "DOC:<path to guide file, relative to repo root>"; every following line
# until the next blank line is "SRC:<path prefix, relative to repo root>"
# (a file or a directory — directory prefixes match anything underneath).
#
# Read by scripts/check-docs-freshness.sh. Kept as plain text (not JSON/YAML)
# so the checker has no parsing dependency beyond bash/grep — it must run
# unmodified inside a git hook on every contributor's machine.

